<header class="dashboard-topbar">
    <div class="glass-card dashboard-topbar__bar">
        <div class="dashboard-topbar__title">
            <p class="dashboard-topbar__heading">{{ page_title|default:"Dashboard" }}</p>
            {% include "components/dashboard/breadcrumb.html" %}
        </div>
        <div class="dashboard-topbar__actions">
            <button type="button"
                    class="dashboard-topbar__icon-btn"
                    aria-label="Notifications{% if notification_count %} ({{ notification_count }} new){% endif %}">
                <i class="bi bi-bell" aria-hidden="true"></i>
                {% if notification_count %}
                    <span class="dashboard-topbar__count">{{ notification_count }}</span>
                {% endif %}
            </button>
            <div class="dashboard-identity">
                <span class="dashboard-identity__avatar" aria-hidden="true">{{ user.first_name|default:user.email|first|upper }}</span>
                <span class="dashboard-identity__meta d-none d-sm-flex">
                    <strong>{{ user.get_full_name|default:user.email }}</strong>
                    <small>{{ user.get_role_display|default:user.role }}</small>
                </span>
            </div>
        </div>
    </div>
</header>
