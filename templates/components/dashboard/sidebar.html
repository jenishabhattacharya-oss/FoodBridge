<div class="dashboard-sidebar">
    <div class="glass-card h-100 d-flex flex-column p-4">
        <!-- Logo -->
        <div class="mb-4">
            <a href="{% url 'home' %}" class="text-decoration-none">
                <h3 class="fw-bold text-white mb-0" style="font-family: var(--font-heading); letter-spacing: -0.03em;">
                    <i class="bi bi-basket2-fill text-warning me-2"></i>FoodBridge
                </h3>
            </a>
            <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill mt-2 py-1 px-2" style="font-size: 0.7rem;">
                <span class="pulse-dot me-1"></span> Live Hub
            </span>
        </div>
        <!-- Navigation -->
        <nav class="flex-grow-1">
            <ul class="nav flex-column">
                {% for item in sidebar_items %}
                    <li class="nav-item mb-2">
                        <a href="{{ item.url }}"
                           class="dashboard-link {% if item.active %}active{% endif %}">
                            <i class="bi {{ item.icon }}"></i>
                            <span>{{ item.label }}</span>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </nav>
        <!-- Footer -->
        <div class="pt-3 border-top border-secondary">
            <a href="{% url 'logout' %}" class="dashboard-link text-white-50">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
</div>
