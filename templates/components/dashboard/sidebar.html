<aside class="dashboard-sidebar" aria-label="Dashboard navigation">
    <div class="glass-card dashboard-sidebar__panel h-100 d-flex flex-column p-3">
        <a href="{% url 'home' %}" class="wn-brand dashboard-sidebar__brand-link" aria-label="SharePlate home">
            <span class="wn-brand__mark">{% include "components/brand_mark.html" %}</span>
            <span class="wn-brand__text">Share<span>Plate</span></span>
        </a>
        <div class="dashboard-sidebar__role">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span>{{ user.get_role_display|default:user.role|default:"Member" }} Hub</span>
        </div>
        <nav class="flex-grow-1 mt-4">
            <ul class="nav flex-column dashboard-nav">
                {% for item in sidebar_items %}
                    <li class="nav-item">
                        <a href="{{ item.url }}"
                           class="dashboard-link {% if item.active %}active{% endif %}"
                           {% if item.active %}aria-current="page"{% endif %}>
                            <i class="bi {{ item.icon }}" aria-hidden="true"></i>
                            <span>{{ item.label }}</span>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </nav>
        <div class="dashboard-sidebar__footer">
            <a href="{% url 'logout' %}" class="dashboard-link dashboard-link--muted">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
</aside>
