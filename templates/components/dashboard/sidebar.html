<div class="dashboard-sidebar">
    <div class="glass-card h-100 d-flex flex-column p-4">
        <!-- Logo -->
        <div class="mb-5">
            <a href="{% url 'home' %}" class="text-decoration-none">
                <h3 class="fw-bold text-white mb-0">
                    <i class="bi bi-basket2-fill text-warning me-2"></i>
                    FoodBridge
                </h3>
            </a>
        </div>
        <!-- Navigation -->
        <nav class="flex-grow-1">
            <ul class="nav flex-column">
                {% for item in sidebar_items %}
                    <li class="nav-item mb-2">
                        <a href="{{ item.url }}"
                           class="dashboard-link {% if item.active %}active{% endif %}">
                            <i class="bi {{ item.icon }}"></i>
                            <span>{{ item.label }}</span>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </nav>
        <!-- Footer -->
        <div class="pt-4 border-top border-secondary">
            <a href="{% url 'logout' %}" class="dashboard-link">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
</div>
