# Free-tier Render blueprint: a free web service and a free PostgreSQL
# database. Free web services sleep after 15 minutes of inactivity and free
# databases expire 30 days after creation — fine for a demo, upgrade the
# plans (service "starter", database "basic-256mb") and re-add a persistent
# disk for real production use.
services:
  - type: web
    name: shareplate-mvp
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health/
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PAYMENT_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shareplate-db
          property: connectionString
      # Free services have no persistent disk; uploads live in /tmp and are
      # lost on restart/redeploy. On a paid plan, set this to /var/data/media
      # together with a disk definition.
      - key: DJANGO_MEDIA_ROOT
        value: /tmp/media
      - key: FOODBRIDGE_PAYMENTS_ENABLED
        value: "false"
      - key: RAZORPAY_MODE
        value: test
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_OAUTH_CLIENT_ID
        sync: false
      - key: RAZORPAY_OAUTH_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_OAUTH_REDIRECT_URI
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      # Seeds the demo workflow on a fresh database. Set to "false" after the
      # first deployment if this stops being a demo.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: DJANGO_EMAIL_HOST
        sync: false
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
databases:
  - name: shareplate-db
    plan: free
    region: singapore
    databaseName: shareplate
    user: shareplate
